<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨비 관제 화면</title>
<style>
:root{--navy:#13294B;--ink:#1B2433;--sub:#56657A;--line:#D5DDE7;--bg:#EEF2F6;--card:#FFFFFF;
  --p1:#B23A2B;--p2:#D9622B;--p3:#12877A;--wait:#7A8799;--amber:#F2B84B;--teal:#12877A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px} header h1 b{color:var(--amber)}
.pill{border-radius:999px;padding:2px 10px;font-size:13px;background:rgba(255,255,255,.14)}
.pill.sim{background:var(--amber);color:#1B2433;font-weight:700} .pill.ok{background:var(--teal)}
main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.panel h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.who{font-size:14px;color:var(--sub)}
.big{display:flex;align-items:baseline;gap:10px;margin:6px 0}
.big .n{font-size:46px;font-weight:800;color:var(--navy);min-width:110px} .big .u{color:var(--sub)}
.state{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:700;background:var(--bg)}
.state.호흡 {background:#DDF1EE;color:var(--teal)}
canvas{width:100%;height:120px;background:#F7F9FB;border-radius:6px;display:block}
.bar{height:12px;background:var(--bg);border-radius:6px;position:relative;overflow:hidden;margin:4px 0 2px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:6px;transition:width .3s}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--p2)}
.small{font-size:12.5px;color:var(--sub)}
.meter{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;margin-top:6px}
.meter b{font-variant-numeric:tabular-nums}
.alerts{display:flex;flex-direction:column;gap:12px}
.empty{color:var(--sub);padding:30px;text-align:center;border:2px dashed var(--line);border-radius:10px}
.card{background:var(--card);border-radius:10px;border-left:8px solid var(--wait);padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.P1{border-color:var(--p1)} .card.P2{border-color:var(--p2)} .card.P3{border-color:var(--p3)}
.card.done{opacity:.6}
.ch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{color:#fff;background:var(--wait);border-radius:6px;padding:2px 10px;font-weight:800}
.P1 .badge{background:var(--p1)} .P2 .badge{background:var(--p2)} .P3 .badge{background:var(--p3)}
.wait .badge{animation:pulse 1s infinite} @keyframes pulse{50%{opacity:.45}}
.ch .t{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:8px 0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:2px 0 2px 14px;font-size:14px}
.tl li:before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.tl .d{display:inline-block;min-width:64px;color:var(--sub);font-variant-numeric:tabular-nums}
.sum{background:#F7F9FB;border-radius:8px;padding:10px 12px;margin-top:6px}
.sum h4{margin:6px 0 2px;font-size:13.5px;color:var(--navy)}
.sum p,.sum ul{margin:2px 0} .sum ul{padding-left:20px}
.cite{display:inline-block;font-size:11.5px;padding:0 5px;border-radius:4px;background:#DCE3EC;color:var(--navy);margin:0 1px}
.raise{background:#FFF4D6;border-radius:6px;padding:4px 8px;font-size:13px;margin-top:6px}
details{font-size:13px;color:var(--sub)} details summary{cursor:pointer}
.act{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.act span{font-size:13px;color:var(--sub);margin-right:auto}
button{font:inherit;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;background:var(--navy);color:#fff}
button.alt{background:#DCE3EC;color:var(--navy)} button:disabled{opacity:.5;cursor:default}
.total{font-weight:800;color:var(--navy)}
footer{max-width:1500px;margin:0 auto 20px;padding:0 16px}
.sim{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#FFF8E6;border:1px solid #F2D49B;border-radius:10px;padding:10px 12px}
.sim b{margin-right:6px}
.a119{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-radius:8px;padding:8px 12px;margin:8px 0}
.a119 .sp{flex:1} .a119.cd{background:#FCEBDD;color:#B23A2B;animation:pulse 1s infinite}
.a119.rep{background:#B23A2B;color:#fff} .a119.rep .small{color:#FCEBDD} .a119.can{background:#E3E8EF;color:#56657A}
.a119 .left{font-size:22px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1><b>숨비</b> 관제 화면</h1>
  <span class="pill" id="src">입력 대기</span>
  <span class="pill" id="rag">AI 요약 준비 중</span>
  <span class="pill" id="rtt">전송 —</span>
  <span class="pill" id="conn">연결 중</span>
</header>
<main>
  <section class="panel" aria-label="실시간 상태">
    <h2>실시간 상태 <span class="small">(게이트웨이 특징값, 1초마다)</span></h2>
    <div class="who">대상자 R-001 · 김○순(가명), 84세 · 침실 <span class="small">(가상 대상자)</span></div>
    <div class="big"><span class="n" id="bpm">—</span><span class="u">회/분 호흡</span></div>
    <span class="state" id="state">보정 중</span>
    <h2 style="margin-top:12px">호흡 파형 <span class="small">(최근 30초)</span></h2>
    <canvas id="wave" width="800" height="240" aria-label="호흡 파형"></canvas>
    <h2 style="margin-top:12px">움직임 지수 <span class="small" id="mr">—</span></h2>
    <div class="bar"><i id="mbar" style="width:0%"></i><span class="mk" style="left:22%"></span><span class="mk" style="left:60%"></span></div>
    <div class="small">표시선: 조용함 기준(2.2배) · 움직임 기준(6배), 보정값 대비</div>
    <h2 style="margin-top:12px">데이터 흐름</h2>
    <div class="meter">
      <span>집 안에서 처리한 원본 신호(CSI)</span><b id="raw">0 KB</b>
      <span>관제로 보낸 특징값·경보</span><b id="sent">0 KB</b>
      <span>밖으로 보낸 원본 신호</span><b style="color:var(--teal)">0 B</b>
    </div>
  </section>
  <section aria-label="경보">
    <div class="alerts" id="alerts"><div class="empty" id="noalert">경보 없음 · 낙상·호흡 이상이 감지되면 여기에 표시됩니다</div></div>
  </section>
</main>
<footer>
  <div class="sim" id="simbar" hidden>
    <b>시연 조작</b>
    <button class="alt" data-s='{"state":"sit_breath","bpm":15}'>앉아서 호흡(15회)</button>
    <button class="alt" data-s='{"state":"sit_breath","bpm":26}'>빠른 호흡(26회)</button>
    <button class="alt" data-s='{"state":"walk"}'>걷기</button>
    <button data-s='{"state":"fall","after_fall":"lying_breath"}'>낙상 → 누워서 호흡</button>
    <button data-s='{"state":"fall","after_fall":"lying_no_breath"}'>낙상 → 호흡 멈춤</button>
    <button class="alt" data-s='{"state":"lying_no_breath"}'>호흡 멈춤</button>
    <button class="alt" data-s='{"state":"empty"}'>빈 방</button>
    <button data-s='{"fire":1}'>화재 감지기</button>
    <button class="alt" id="reset">경보 초기화</button>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cite = (s) => esc(s).replace(/\[(G\d+|R-\d{3}#[PNA]\d*)\]/g, '<span class="cite">$1</span>');
const alerts = {};
let wave = [];
const done = new Set();
let offset = 0;   // 서버 시각 - 브라우저 시각(초)
const qs = new URLSearchParams(location.search);
const QKEY = (qs.get("key") || "").replace(/ /g, "+");   // 키의 '+'가 주소창에서 공백으로 바뀌는 경우 되돌림
try { if (QKEY) localStorage.setItem("sumbiKey", QKEY); } catch (e) {}
const KEY = QKEY || (() => { try { return localStorage.getItem("sumbiKey") || ""; } catch (e) { return ""; } })();
const hdr = () => Object.assign({"Content-Type": "application/json"}, KEY ? {"x-sumbi-key": KEY} : {});
const nowS = () => Date.now() / 1000 + offset;
function a119(a) {
  const s = a.auto119; if (!s) return "";
  if (s.status === "countdown") return `<div class="a119 cd"><b>119 자동 신고까지 <span class="left" data-deadline="${s.deadline}">${Math.max(0, s.deadline - nowS()).toFixed(0)}</span>초</b> <span class="small">(${esc(s.reason)} · 시연: 실제 발신 없음)</span><span class="sp"></span><button class="alt" data-act="cancel" data-id="${esc(a.id)}">취소(직접 확인)</button><button data-act="report_now" data-id="${esc(a.id)}">즉시 신고</button></div>`;
  if (s.status === "reported") return `<div class="a119 rep"><b>119 ${esc(s.how || "자동")} 신고 완료</b> <span class="small">(시연: 실제 발신 없음 · 출동 여부는 119 상황실이 결정)</span></div>`;
  if (s.status === "cancelled") return `<div class="a119 can"><b>119 자동 신고 취소</b> <span class="small">(관제가 직접 확인)</span></div>`;
  return "";
}
setInterval(() => document.querySelectorAll(".left").forEach((el) => el.textContent = Math.max(0, el.dataset.deadline - nowS()).toFixed(0)), 250);

function drawWave() {
  const c = $("wave"), g = c.getContext("2d"), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "#D5DDE7"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
  if (wave.length < 2) return;
  const n = 150, step = W / (n - 1), off = n - wave.length;
  g.strokeStyle = "#12877A"; g.lineWidth = 3; g.beginPath();
  wave.forEach((v, i) => { const x = (off + i) * step, y = H / 2 - Math.max(-2.5, Math.min(2.5, v)) * H / 6;
    i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}

function onFeatures(f) {
  $("src").textContent = "입력: " + (f.source || "—");
  $("src").className = "pill" + ((f.source || "").includes("시뮬레이션") ? " sim" : " ok");
  $("simbar").hidden = !(f.source || "").includes("시뮬레이션");
  if (f.rtt_ms != null) $("rtt").textContent = "게이트웨이→관제 " + f.rtt_ms + " ms";
  $("bpm").textContent = f.bpm ? f.bpm.toFixed(0) : "—";
  $("state").textContent = f.state || "—";
  $("state").className = "state" + (f.breathing ? " 호흡" : "");
  if (f.motion_ratio != null) {
    $("mr").textContent = f.motion_ratio.toFixed(1) + "배";
    $("mbar").style.width = Math.min(100, f.motion_ratio * 10) + "%";
    $("mbar").style.background = f.motion_ratio > 6 ? "#D9622B" : "#12877A";
  }
  if (f.wave && f.wave.length) { wave = wave.concat(f.wave).slice(-150); drawWave(); }
  if (f.raw_bytes != null) $("raw").textContent = (f.raw_bytes / 1024).toFixed(0) + " KB";
  if (f.sent_bytes != null) $("sent").textContent = (f.sent_bytes / 1024).toFixed(1) + " KB";
}

function rank(a) { return {"P1": 0, "P2": 2, "P3": 3}[a.priority] ?? 1; }

function card(a) {
  const t0 = a.detected_at, pr = a.priority || "확인 중";
  const cls = ["card", pr.startsWith("P") ? pr : "wait", done.has(a.id) ? "done" : ""].join(" ");
  const tl = (a.timeline || []).map((x) => `<li><span class="d">+${(x.at - t0).toFixed(1)}초</span>${esc(x.label)}</li>`).join("");
  let sum = "";
  if (a.summary) {
    const o = a.summary.output || {}, cf = Array.isArray(o.check_first) ? o.check_first : [o.check_first].filter(Boolean);
    const raised = a.summary.rule_floor && a.summary.llm_priority !== pr
      ? `<div class="raise">규칙 하한 적용: AI ${esc(a.summary.llm_priority)} → ${esc(pr)} (${esc(a.summary.rule_reasons.join("; "))})</div>` : "";
    const ev = (a.summary.context || []).map((c) => `<details><summary>[${esc(c.id)}] ${esc(c.kind)}</summary>${esc(c.text)}</details>`).join("");
    const cited = ((a.summary.check || {}).cited || []).map((c) => `<span class="cite">${esc(c)}</span>`).join("");
    sum = `<div class="sum"><h4>AI 상황 요약 <span class="small">(참고 · 지침·돌봄 기록 검색 근거)</span></h4><p>${cite(o.summary)}</p>
      <p class="small">인용 근거: ${cited || "—"}</p>
      <h4>먼저 확인할 것</h4><ul>${cf.map((x) => `<li>${cite(x)}</li>`).join("")}</ul>
      <h4>119 전달문</h4><p>${cite(o.tell_119 || "—")}</p>${raised}
      <h4>근거 원문</h4>${ev}</div>`;
  }
  const last = (a.timeline || []).slice(-1)[0];
  const total = a.summary && last ? `<span class="total">감지 → 관제 요약 ${(last.at - t0).toFixed(1)}초</span> <span class="small">(목표 60초)</span>` : "";
  const fire = a.kind === "fire" ? `<div class="small">화재는 확인 대화 없이 즉시 신고</div>` : "";
  return `<article class="${cls}" id="c-${esc(a.id)}">
    <div class="ch"><span class="badge">${esc(pr)}</span><b>${esc(a.kind_ko)}</b><span>${esc(a.name)} · ${esc(a.room)}</span>
    <span class="t">${new Date(t0 * 1000).toLocaleTimeString("ko-KR")}</span></div>${a119(a)}${fire}
    <ul class="tl">${tl}</ul>${sum}
    <div class="act"><span>${total || "출동 여부는 119 상황실이 결정 · 관제는 취소·즉시 신고 가능"}</span></div></article>`;
}

function render() {
  const list = Object.values(alerts).sort((x, y) => rank(x) - rank(y) || y.detected_at - x.detected_at);
  $("noalert").hidden = list.length > 0;
  $("alerts").innerHTML = list.map(card).join("") + `<div class="empty" id="noalert" ${list.length ? "hidden" : ""}>경보 없음 · 낙상·호흡 이상이 감지되면 여기에 표시됩니다</div>`;
}

function connect() {
  const es = new EventSource("/api/stream");
  es.onopen = () => { $("conn").textContent = "관제 연결됨"; $("conn").className = "pill ok"; };
  es.onerror = () => { $("conn").textContent = "연결 끊김 · 재시도"; $("conn").className = "pill"; };
  es.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.now) offset = d.now - Date.now() / 1000;
    if (d.type === "features") onFeatures(d);
    else if (d.type === "alert") { alerts[d.alert.id] = d.alert; render(); }
    else if (d.type === "hello") { d.alerts.forEach((a) => alerts[a.id] = a); render(); setRag(d.rag); }
    else if (d.type === "status") setRag(d.rag);
    else if (d.type === "reset") { for (const k in alerts) delete alerts[k]; done.clear(); render(); }
  };
}
function setRag(s) { $("rag").textContent = s === "ready" ? "AI 요약 준비됨(로컬)" : s === "worker" ? "AI 요약: 노트북 작업기(망 내 AI)" : "AI 요약 준비 중"; $("rag").className = "pill" + (s === "ready" ? " ok" : ""); }

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.s) await fetch("/api/sim", {method: "POST", headers: hdr(), body: b.dataset.s});
  if (b.id === "reset") await fetch("/api/reset", {method: "POST", headers: hdr()});
  if (b.dataset.act) await fetch(`/api/alert/${encodeURIComponent(b.dataset.id)}/${b.dataset.act}`, {method: "POST", headers: hdr(), body: JSON.stringify({who: "관제"})});
});
if (new URLSearchParams(location.search).has("snapshot")) {
  // 스냅숏: 실시간 연결 없이 현재 상태를 한 번 그린다(캡처·백업용)
  fetch("/api/alerts").then((r) => r.json()).then((d) => {
    if (d.now) offset = d.now - Date.now() / 1000;
    d.alerts.forEach((a) => alerts[a.id] = a); setRag(d.rag);
    wave = d.wave || []; onFeatures(Object.assign({}, d.features, {wave: []})); drawWave(); render();
    $("conn").textContent = "스냅숏";
  });
} else { connect(); drawWave(); }
</script>
</body>
</html>
